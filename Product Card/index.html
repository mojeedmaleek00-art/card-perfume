<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">


    <!--google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    
    <main id="card__container">
        
        <article class="product">
            <picture class="product__img">

                <img src="images/image-product-desktop.webp" alt="Gabrielle Essense perfume bottle laying flat on a table with green leaves above and below it">
            
            </picture>
            <p class="product__category">Perfume</p>

            <h1 class="product__content">Gabrielle Essence Eau De Parfum</h1>
            
            <p>A floral, solar and voluptous interpretation

<div class="flex-group">
            <p class="product__price">
                <span>Current Price</span>
                $149.99
            </p>




            <p class="product__original-price">
                <span>Original Price</span>
                <s>$169.99</s>
            </p>
</div>

<button>
  <i class="fa-solid fa-cart-shopping"></i>
  Add to cart
</button>
           </button>
        </article>
    </main>
